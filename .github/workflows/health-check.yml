name: Health Check

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oze-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dummy
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      FASTAPI_INTERNAL_BASE_URL: http://127.0.0.1:8000
      BILLING_INTERNAL_SECRET: ci-dummy-billing-secret
      STRIPE_SECRET_KEY: sk_test_ci_dummy
      STRIPE_PRICE_MONTHLY: price_ci_dummy
      OWNER_ADMIN_EMAILS: owner@example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run web units
        run: npm run test:web-units

      - name: Run invariants
        run: npm run test:invariants

      - name: Build
        run: npm run build
